<title>Copywriting Skill Eval</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column; every string is a card with the two arms side by side, three runs each. */
:root {
  --bg: #f2f4ef; --surface: #fbfcfa; --fg: #1b201c; --muted: #5c655d; --line: #d7ddd4;
  --skill: #2f6f4d; --skill-soft: #dfeee4; --base: #4d5968; --base-soft: #e4e8ee;
  --flag: #a8510f; --flag-soft: #fbecd9; --ok: #2c7a4c; --no: #b23b2a;
  --mock-bg: #2a2c2b; --mock-fg: #ecefec; --mock-dim: #a4aaa5;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141714; --surface: #1c201d; --fg: #e6eae5; --muted: #99a29a; --line: #2f3631;
  --skill: #8cc6a2; --skill-soft: #1f3328; --base: #a8b4c3; --base-soft: #252b33;
  --flag: #eaa35b; --flag-soft: #38281a; --ok: #7ccb98; --no: #f08c7b;
  --mock-bg: #0f1110; --mock-fg: #ecefec; --mock-dim: #a4aaa5; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141714; --surface: #1c201d; --fg: #e6eae5; --muted: #99a29a; --line: #2f3631;
  --skill: #8cc6a2; --skill-soft: #1f3328; --base: #a8b4c3; --base-soft: #252b33;
  --flag: #eaa35b; --flag-soft: #38281a; --ok: #7ccb98; --no: #f08c7b;
  --mock-bg: #0f1110; --mock-fg: #ecefec; --mock-dim: #a4aaa5; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 400 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 72px; }
main { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px; }
h1, h2, h3, h4, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
h1 { font: 700 clamp(30px, 5vw, 46px)/1.08 var(--display); letter-spacing: -0.02em; text-wrap: balance; max-width: 18ch; }
h2 { font: 700 26px/1.2 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
h3 { font: 600 17px/1.3 var(--body); }
h4 { font: 600 12px/1.3 var(--body); letter-spacing: 0.07em; text-transform: uppercase; }
.eyebrow { font: 600 12px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--skill); }
.top { display: flex; flex-direction: column; gap: 14px; }
.sub, .lede { color: var(--muted); max-width: 68ch; }
section { display: flex; flex-direction: column; gap: 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 14px; margin-top: 6px; }
.key { display: inline-flex; align-items: center; gap: 8px; }
.key::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--base); }
.key.skill::before { background: var(--skill); }
.tog { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; color: var(--muted); cursor: pointer; }
.tog input { accent-color: var(--skill); width: 16px; height: 16px; }
.tog input:focus-visible { outline: 2px solid var(--skill); outline-offset: 2px; }

.verdict { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.verdict li { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--muted); border-radius: 6px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.verdict li.win { border-top-color: var(--skill); }
.verdict li.loss { border-top-color: var(--no); }
.verdict li.tie { border-top-color: var(--base); }
.verdict b { font: 600 16px/1.3 var(--body); }
.verdict span { color: var(--muted); font-size: 14.5px; }

.str { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.str.flagged { border-color: var(--flag); }
.str header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.ctx { color: var(--muted); font-size: 13.5px; }
.lab { font: 600 11px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 10px; }
.was { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 0; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.ui { font-family: var(--ui); font-size: 15px; }
.none { color: var(--muted); font-style: italic; }
.pl { display: none; width: 100%; font-family: var(--ui); font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.show-pl .pl { display: block; }
.arms { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
.arm { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.arm h4 { color: var(--base); }
.arm.skill h4 { color: var(--skill); }
.arm ul { display: flex; flex-direction: column; gap: 6px; }
.arm li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 7px 10px; border-radius: 5px; background: var(--base-soft); }
.arm.skill li { background: var(--skill-soft); }
.arm li.kept, .arm li.gone { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
.n { font: 600 12px/1.9 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.t { min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 3px; }
.mark { align-self: flex-start; font: 600 11px/1.5 var(--mono); padding: 0 6px; border-radius: 3px; border: 1px solid currentColor; }
.mark.bad { color: var(--no); } .mark.good { color: var(--ok); } .mark.warn { color: var(--flag); }
.note { background: var(--flag-soft); border-left: 3px solid var(--flag); padding: 10px 14px; border-radius: 0 5px 5px 0; font-size: 14.5px; }
.note b { display: block; font: 600 11px/1.6 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--flag); }

.truth { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
thead th { font: 600 11px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.grp th { font: 600 12px/1.3 var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--base); background: var(--base-soft); }
tr.grp.skill th { color: var(--skill); background: var(--skill-soft); }
td.n { width: 34px; }
table.focus { min-width: 720px; }
table.score { min-width: 760px; font-variant-numeric: tabular-nums; }
.mock { min-width: 300px; }
.mock .row { display: flex; justify-content: space-between; gap: 16px; background: var(--mock-bg); color: var(--mock-fg); border-radius: 8px; padding: 9px 12px; }
.mock .v { color: var(--mock-dim); font-family: var(--ui); white-space: nowrap; }
.mock .zero { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
td.slot { font: 600 12px/1 var(--mono); white-space: nowrap; }
td.slot.ok { color: var(--ok); } td.slot.no { color: var(--no); }
td.slot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 7px; }
td.slot.no::before { border-radius: 1px; }
.after { color: var(--muted); max-width: 68ch; }
.hl { font: 500 19px/1.3 var(--display); }
.hnote { font-size: 13.5px; color: var(--muted); }
.method { display: flex; flex-direction: column; gap: 8px; color: var(--muted); max-width: 72ch; padding-left: 18px; list-style: disc; }
@media (max-width: 720px) { .arms { grid-template-columns: 1fr; } .tog { margin-left: 0; } }
</style>
