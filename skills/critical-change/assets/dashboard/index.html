<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the stage on top; live checks in a two-column grid on the left two thirds; on the right third the smoke tests, then the log.
   Same tokens as the change page (scripts/change.py), so both read as one product. Do not restyle per change. */
:root{--bg:#f3f5f8;--surface:#fff;--ink:#16202b;--muted:#5a6776;--line:#d2d9e1;--accent:#2457a6;--accent-soft:#2457a61f;
--ok:#1c7445;--ok-bg:#dff1e6;--warn:#8f5600;--warn-bg:#fbeed3;--crit:#b3261e;--crit-bg:#fbe4e1;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e141a;--surface:#172029;--ink:#dee5ec;--muted:#96a3b0;--line:#2c3844;--accent:#8ab4f8;--accent-soft:#8ab4f826;--ok:#7fd0a0;--ok-bg:#17342a;--warn:#f0b354;--warn-bg:#3a2c12;--crit:#ff8a80;--crit-bg:#42201d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding:1.25rem max(16px,env(safe-area-inset-right,0px)) 2rem max(16px,env(safe-area-inset-left,0px))}
.page{display:grid;gap:1.25rem;max-width:88rem;margin-inline:auto}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
svg{display:block}

/* stage on top */
.top{display:grid;gap:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem}
.head{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}
h1{font-size:1.25rem;line-height:1.2;font-weight:600;text-wrap:balance}
.right{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center}
.signal{display:flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.signal i{width:.5rem;height:.5rem;border-radius:50%;background:var(--ok)}
.verdict{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;font-size:.9rem;padding:.4rem .7rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.verdict.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.verdict.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.verdict.bad{color:var(--crit);background:var(--crit-bg);border-color:var(--crit)}
.demo{font:600 .72rem var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:.3rem .5rem;border-radius:4px}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.stages li{display:grid;justify-items:center;gap:.3rem;position:relative;font-size:.85rem;font-weight:500;color:var(--muted);text-align:center}
.stages li::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--line)}
.stages li:first-child::before{display:none}
.stages li.done::before,.stages li.now::before{background:var(--ok)}
.mark{position:relative;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--surface)}
.done .mark{background:var(--ok);border-color:var(--ok)}
.bad .mark{background:var(--crit);border-color:var(--crit)}
.now .mark{border-color:var(--accent);border-width:3px}
.now .mark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.stages li.done,.stages li.now{color:var(--ink)}
.stages li.now{font-weight:600}
.stages li.bad{color:var(--crit);font-weight:600}
.line{font-size:1.05rem;font-weight:500}
.steps{display:flex;flex-wrap:wrap;gap:.4rem}
.steps li{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;padding:.25rem .55rem;border:1px solid var(--line);border-radius:999px;color:var(--muted);max-width:100%}
.steps li b{font:600 .78rem var(--mono);color:var(--ink)}
.steps li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li.done{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.steps li.failed{color:var(--crit);background:var(--crit-bg);border-color:var(--crit)}
.steps li.next{border-color:var(--accent);color:var(--ink)}
.steps .way{border:0;padding-left:0;font-weight:600;color:var(--ink)}

.lost{display:none;background:var(--crit);color:var(--bg);font-weight:600;padding:.7rem 1rem;border-radius:8px}
body.lost .lost{display:block}

/* checks left, log right */
.main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.tile{display:grid;gap:.55rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.85rem .95rem;min-width:0}
.tile.fail{border-color:var(--crit);background:var(--crit-bg)}
.tile.demand{border-style:dashed}
.tile header{display:flex;align-items:baseline;gap:.5rem}
.id{font:600 .76rem var(--mono);color:var(--muted)}
h3{font-size:.95rem;font-weight:600;line-height:1.3;flex:1;min-width:0}
.tag{font:600 .66rem var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;flex:none}
.read{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .55rem;min-height:2.3rem}
.beat{position:relative;width:.8rem;height:.8rem;flex:none}
.beat b,.beat i{position:absolute;inset:0;border-radius:50%;background:var(--muted)}
.ok .beat b,.ok .beat i{background:var(--ok)}
.fail .beat b,.fail .beat i{background:var(--crit)}
.beat i{opacity:0}
.val{font-size:1.7rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ping .val{font-size:1.25rem}
.unit{color:var(--muted);align-self:flex-end;padding-bottom:.1rem}
.state{margin-left:auto;display:inline-flex;align-items:center;gap:.3rem;font-size:.82rem;font-weight:600;color:var(--muted)}
.ok .state{color:var(--ok)}
.fail .state{color:var(--crit)}
.plot{height:64px;position:relative}
.plot svg{width:100%;height:64px;overflow:visible}
.lim{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.area{fill:var(--accent-soft)}
.ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tile.fail .end{stroke:var(--crit-bg)}
.halo{fill:var(--accent);opacity:0;transform-box:fill-box;transform-origin:center}
.cross{stroke:var(--muted);stroke-width:1}
.ticks{display:flex;align-items:flex-end;gap:2px;height:64px;padding-bottom:6px}
.ticks span{flex:1;max-width:8px;min-width:2px;height:16px;border-radius:2px;background:var(--ok);opacity:.75}
.ticks span.no{height:36px;background:var(--crit);opacity:1}
.ticks em{font-style:normal;color:var(--muted);font-size:.85rem;align-self:center}
.tile>*{min-width:0}
.tile footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.1rem .75rem;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile footer span{min-width:0;overflow-wrap:anywhere}

/* the soft animation means: this value is being watched right now */
@keyframes breathe{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(2.6);opacity:0}}
.tile.live .beat i,.tile.live .halo{animation:breathe 2.6s ease-out infinite}
.tile.running .beat i,.tile.running .halo{animation-duration:.9s}
body.lost .beat i,body.lost .halo{animation:none}
body.lost .tiles{opacity:.55}
@media (prefers-reduced-motion:reduce){.tile.live .beat i,.tile.live .halo{animation:none}}

/* right column: smoke tests on top, the log under them */
.side{display:grid;gap:.9rem;position:sticky;top:1rem;max-height:calc(100vh - 2rem);grid-template-rows:auto minmax(8rem,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.85rem .95rem;display:grid;gap:.6rem;min-height:0}
.panel.smoke.fail{border-color:var(--crit)}
h2{font-size:.95rem;font-weight:600;display:flex;justify-content:space-between;gap:.75rem;align-items:baseline}
h2 span{font-weight:500;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
#smoke li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.1rem .55rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
#smoke li:first-child{border-top:0;padding-top:0}
#smoke li:last-child{padding-bottom:0}
#smoke .what{font-size:.88rem;line-height:1.35}
#smoke .what b{font:600 .76rem var(--mono);color:var(--muted);margin-right:.35rem}
#smoke .res{display:inline-flex;align-items:center;gap:.3rem;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
#smoke li.ok .res{color:var(--ok)}
#smoke li.fail .res{color:var(--crit)}
#smoke li.fail .what{color:var(--crit);font-weight:600}
#smoke .sub{grid-column:2/-1;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
#smoke li.live .beat i,#smoke li.running .beat i{animation:breathe 2.6s ease-out infinite}
#smoke li.running .beat i{animation-duration:.9s}
body.lost #smoke .beat i{animation:none}
@media (prefers-reduced-motion:reduce){#smoke li.live .beat i,#smoke li.running .beat i{animation:none}}

/* log: who said it is the first thing you read */
.log{grid-template-rows:auto auto minmax(0,1fr)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.78rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
#log{overflow-y:auto;display:grid;align-content:start}
#log li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.1rem .5rem;align-items:baseline;padding:.45rem 0;border-top:1px solid var(--line);font-size:.86rem}
#log li:first-child{border-top:0}
#log time{font:.76rem var(--mono);color:var(--muted)}
.src{display:inline-flex;align-items:center;gap:.25rem;font:600 .66rem var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:.16rem .4rem;border-radius:4px;white-space:nowrap}
.src.monitor{color:var(--accent);border:1px solid var(--accent)}
.src.agent{color:var(--surface);background:var(--ink);border:1px solid var(--ink)}
#log p{grid-column:1/-1;overflow-wrap:anywhere}
#log li.bad p{color:var(--crit);font-weight:600}
#log li.ok p{color:var(--ink)}
.empty{color:var(--muted);font-size:.86rem}

@media (max-width:60rem){.main{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}.log{max-height:28rem}}
@media (max-width:36rem){.tiles{grid-template-columns:minmax(0,1fr)}.stages li{font-size:.72rem}}
</style>
</head>
<body>
<div class="page">
  <div class="lost" role="alert">No signal from the monitor for <span id="gap">0</span> s. What is shown below may be out of date.</div>

  <section class="top" aria-label="Where the change stands">
    <div class="head">
      <h1 id="title">Connecting to the monitor</h1>
      <div class="right">
        <span class="demo" id="demo" hidden>Demo: invented readings</span>
        <span class="verdict" id="verdict"></span>
        <span class="signal"><i></i><span id="signal">connecting</span></span>
      </div>
    </div>
    <ol class="stages" id="stages"></ol>
    <p class="line" id="line"></p>
    <ul class="steps" id="steps"></ul>
  </section>

  <div class="main">
    <section class="tiles" id="tiles" aria-label="Checks"></section>
    <div class="side">
    <section class="panel smoke" id="smokePanel" aria-label="Smoke tests">
      <h2>Smoke tests <span id="smokeSum"></span></h2>
      <ol id="smoke"></ol>
    </section>
    <aside class="panel log" aria-label="Log">
      <h2>Log</h2>
      <p class="legend">
        <span><span class="src monitor">Monitor</span> seen by a check</span>
        <span><span class="src agent">Agent</span> recorded by the agent</span>
      </p>
      <ol id="log"><li class="empty">Nothing yet.</li></ol>
    </aside>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const CHECK = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';
const CROSS = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg>';
const SLOTS = 60, H = 64, PAD = 7;
const NS = "http://www.w3.org/2000/svg";
let lastOk = 0, skew = 0, tiles = {}, rows = {}, hover = {}, logKey = "";

const fmt = v => v == null ? "" : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US") : Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(2);
const clock = at => new Date(at * 1000).toLocaleTimeString([], {hour12: false});
const ago = (at, now) => at == null ? "" : Math.max(0, Math.round(now - at)) + " s ago";
const limitText = c => ["min", "max"].filter(k => c[k] != null).map(k => `${k} ${fmt(c[k])} ${c.unit || ""}`.trim()).join(", ");

function header(s) {
  const ch = s.change;
  document.title = ch.title ? ch.title + ": live" : "Change dashboard";
  $("title").textContent = ch.title || "Change dashboard";
  $("line").textContent = ch.line || "";
  $("demo").hidden = !s.demo;
  const v = s.verdict;
  $("verdict").className = "verdict " + v.state;
  $("verdict").innerHTML = (v.state === "ok" ? CHECK : v.state === "bad" || v.state === "warn" ? CROSS : "") + esc(v.text);
  $("stages").innerHTML = ch.stages.map(st =>
    `<li class="${st.state}"><span class="mark">${st.state === "done" ? CHECK : st.state === "bad" ? CROSS : ""}</span>${esc(st.name)}</li>`).join("");
  const next = ch.steps.find(x => x.status !== "done");
  const chip = (x, isNext) => `<li class="${x.status}${isNext ? " next" : ""}" title="${esc(x.action)}"><b>${esc(x.id)}</b><span>${
    x.status === "done" ? "done" : x.status === "failed" ? "failed" : isNext ? esc(x.action) : "waiting"}</span></li>`;
  $("steps").innerHTML = ch.steps.map(x => chip(x, x === next && !ch.reversal.length)).join("") +
    (ch.reversal.length ? `<li class="way">Way back</li>` + ch.reversal.map(x => chip(x, false)).join("") : "");
}

function makeTile(c) {
  const el = document.createElement("article");
  el.innerHTML = `<header><span class="id">${esc(c.id)}</span><h3>${esc(c.label)}</h3><span class="tag"></span></header>
    <div class="read"><span class="beat"><i></i><b></b></span><span class="val"></span><span class="unit"></span><span class="state"></span></div>
    <div class="plot"></div><footer><span class="note"></span><span class="age"></span></footer>`;
  if (c.kind === "chart") {
    const svg = document.createElementNS(NS, "svg");
    svg.innerHTML = '<line class="lim"/><path class="area"/><path class="ln"/><line class="cross" visibility="hidden"/><circle class="halo" r="5"/><circle class="end" r="4"/>';
    svg.addEventListener("mousemove", e => { const r = svg.getBoundingClientRect(); hover[c.id] = (e.clientX - r.left) / r.width; draw(c.id); });
    svg.addEventListener("mouseleave", () => { delete hover[c.id]; draw(c.id); });
    el.querySelector(".plot").append(svg);
  } else {
    el.querySelector(".plot").innerHTML = '<div class="ticks"></div>';
  }
  $("tiles").append(el);
  return {el, c};
}

function draw(id) {
  const {el, c, now} = tiles[id];
  const pts = c.history.filter(p => p[1] != null);
  const svg = el.querySelector(".plot svg"), w = Math.max(120, Math.round(el.querySelector(".plot").getBoundingClientRect().width));
  const note = el.querySelector(".note");
  svg.setAttribute("viewBox", `0 0 ${w} ${H}`);
  note.textContent = "limit: " + limitText(c);
  if (!pts.length) return;
  const limits = ["min", "max"].map(k => c[k]).filter(v => v != null);
  let lo = Math.min(...pts.map(p => p[1]), ...limits), hi = Math.max(...pts.map(p => p[1]), ...limits);
  const span = (hi - lo) || 1; lo -= span * 0.12; hi += span * 0.12;
  const x = i => PAD + (i + SLOTS - pts.length) * (w - 2 * PAD) / (SLOTS - 1);
  const y = v => H - PAD - (v - lo) / (hi - lo) * (H - 2 * PAD);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p[1]).toFixed(1)}`).join("");
  const lx = x(pts.length - 1), ly = y(pts[pts.length - 1][1]);
  svg.querySelector(".ln").setAttribute("d", path);
  svg.querySelector(".area").setAttribute("d", `${path}L${lx.toFixed(1)} ${H}L${x(0).toFixed(1)} ${H}Z`);
  const lim = svg.querySelector(".lim"), limY = y(c.max != null ? c.max : c.min);
  for (const [k, v] of Object.entries({x1: 0, x2: w, y1: limY, y2: limY})) lim.setAttribute(k, v);
  for (const sel of [".end", ".halo"]) { svg.querySelector(sel).setAttribute("cx", lx); svg.querySelector(sel).setAttribute("cy", ly); }
  const cross = svg.querySelector(".cross");
  if (hover[id] != null) {
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((hover[id] * w - PAD) / ((w - 2 * PAD) / (SLOTS - 1)) - (SLOTS - pts.length))));
    for (const [k, v] of Object.entries({x1: x(i), x2: x(i), y1: 0, y2: H})) cross.setAttribute(k, v);
    cross.setAttribute("visibility", "visible");
    note.textContent = `${clock(pts[i][0])}: ${fmt(pts[i][1])} ${c.unit || ""}`;
  } else cross.setAttribute("visibility", "hidden");
}

function checks(list, now) {
  for (const c of list) {
    if (rows[c.id]) continue;                 // smoke checks live in their own panel
    const t = tiles[c.id] || (tiles[c.id] = makeTile(c));
    Object.assign(t, {c, now});
    const el = t.el, demand = c.on_demand;
    el.className = `tile ${c.kind} ${c.status}${demand ? " demand" : " live"}${c.running ? " running" : ""}`;
    el.querySelector(".tag").textContent = c.critical ? "critical" : "not critical";
    const word = c.status === "waiting" ? (demand ? "Not run yet" : "Waiting") : c.status === "ok" ? (demand ? "Passed" : "Up") : (demand ? "Failed" : "Down");
    const state = el.querySelector(".state");
    if (c.kind === "chart") {
      el.querySelector(".val").textContent = fmt(c.value) || "–";
      el.querySelector(".unit").textContent = c.unit || "";
      state.innerHTML = c.status === "ok" ? CHECK + "Within the limit" : c.status === "fail" ? CROSS + "Past the limit" : "Waiting";
      draw(c.id);
    } else {
      el.querySelector(".val").textContent = word;
      state.innerHTML = c.status === "ok" ? CHECK + "OK" : c.status === "fail" ? CROSS + "Failing" : "";
      el.querySelector(".ticks").innerHTML = c.history.length
        ? c.history.map(p => `<span class="${p[1] ? "" : "no"}" title="${clock(p[0])}: ${p[1] ? "passed" : "failed"}"></span>`).join("")
        : `<em>${demand ? "Runs when the agent asks for it." : "No reading yet."}</em>`;
      el.querySelector(".note").textContent = c.text || "";
    }
    el.querySelector(".age").textContent = c.at == null ? (demand ? "on demand" : "")
      : `checked ${ago(c.at, now)}` + (c.ms != null ? ` · ${c.ms} ms` : "") + (demand ? "" : ` · every ${c.every} s`);
  }
}

// Smoke tests: one row each, fed by the monitor's result when it runs the check and by what the agent recorded.
function smoke(list, all, now) {
  const mon = Object.fromEntries(all.map(c => [c.id, c]));
  let passed = 0, critFail = false;
  for (const s of list) {
    let r = rows[s.id];
    if (!r) {
      r = rows[s.id] = document.createElement("li");
      r.innerHTML = '<span class="beat"><i></i><b></b></span><span class="what"></span><span class="res"></span><span class="sub"></span>';
      $("smoke").append(r);
    }
    const m = mon[s.id], seen = m && m.status !== "waiting" ? m.status : null;
    const result = seen || (s.recorded === "pass" ? "ok" : s.recorded === "fail" ? "fail" : "waiting");
    if (result === "ok") passed++;
    if (result === "fail" && s.critical) critFail = true;
    r.className = result + (m && m.every ? " live" : "") + (m && m.running ? " running" : "");
    r.querySelector(".what").innerHTML = `<b>${esc(s.id)}</b>${esc(s.check)}`;
    r.querySelector(".res").innerHTML = m && m.running ? "Running" : result === "ok" ? CHECK + "Passed" : result === "fail" ? CROSS + "Failed"
      : s.manual ? "By hand" : "Not run yet";
    const bits = [s.critical ? "critical" : "not critical"];
    if (seen) bits.push(`monitor ${ago(m.at, now)}`);
    else if (s.manual) bits.push("done by a person");
    else if (!m) bits.push("no live check, the agent runs it");
    bits.push(s.recorded ? "recorded" : result === "waiting" ? "" : "not recorded yet");
    r.querySelector(".sub").textContent = bits.filter(Boolean).join(" · ");
  }
  $("smokeSum").textContent = list.length ? `${passed} of ${list.length} passed` : "none defined";
  $("smokePanel").classList.toggle("fail", critFail);
}

function log(entries) {
  const key = entries.length + ":" + (entries.length ? entries[entries.length - 1].at : 0);
  if (key === logKey) return;
  logKey = key;
  $("log").innerHTML = entries.length ? entries.slice().reverse().map(e =>
    `<li class="${e.level}"><time>${clock(e.at)}</time><span class="src ${e.source}">${e.source === "agent" ? "Agent" : "Monitor"}</span><span></span><p>${esc(e.text)}</p></li>`).join("")
    : '<li class="empty">Nothing yet.</li>';
}

function signal() {
  const gap = lastOk ? Math.round((Date.now() - lastOk) / 1000) : 0;
  const lost = !lastOk || gap > 4;
  document.body.classList.toggle("lost", lastOk > 0 && lost);
  $("gap").textContent = gap;
  $("signal").textContent = !lastOk ? "connecting" : lost ? "no signal" : "live, updated " + clock((Date.now() + skew) / 1000);
}

async function tick() {
  try {
    const s = await (await fetch("/state", {cache: "no-store"})).json();
    lastOk = Date.now(); skew = s.now * 1000 - Date.now();
    header(s); smoke(s.change.smoke || [], s.checks, s.now); checks(s.checks, s.now); log(s.log);
  } catch (e) { if (!(e instanceof TypeError && /fetch/i.test(e.message))) console.error(e); }   // a lost connection is the banner's job
  signal();
}
tick(); setInterval(tick, 1000);
addEventListener("resize", () => Object.values(tiles).forEach(t => t.c.kind === "chart" && draw(t.c.id)));
</script>
</body>
</html>
